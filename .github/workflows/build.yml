name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AlAsma.Admin/AlAsma.Admin.csproj

      - name: Build
        run: dotnet build AlAsma.Admin/AlAsma.Admin.csproj --no-restore -c Release

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list AlAsma.Admin/AlAsma.Admin.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
